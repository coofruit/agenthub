  }
}

function formatConvTime(conv) {
  const raw = conv.LastChatTime || conv.CreateTime;
  if (!raw) return '';
  const d = new Date(raw.replace(/-/g, '/'));
  if (isNaN(d.getTime())) return raw.slice(0, 10);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const pad = n => String(n).padStart(2, '0');
  if (isToday) return `今天 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return `昨天 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function renderConversationList() {
  const countEl = $('convCount');
  if (countEl) countEl.textContent = state.conversations.length;

  if (!state.conversations.length) {
    convList.innerHTML = `<div class="conv-empty"><span class="conv-empty-icon">💬</span>暂无历史对话<br>点击上方「新建对话」开始</div>`;
    return;
  }
  convList.innerHTML = '';
  state.conversations.forEach(c => {
    const wrap = document.createElement('div');
    wrap.className = 'conv-item-wrap';
    wrap.dataset.id = c.AppConversationID;
    if (c.AppConversationID === state.appConversationId) wrap.classList.add('active');

    const title = getConvDisplayTitle(c);
    const time = formatConvTime(c);

    const btn = document.createElement('button');
    btn.className = 'conv-item';
    btn.type = 'button';
    btn.innerHTML = `
      <span class="conv-icon">💬</span>
      <span class="conv-meta">
        <span class="conv-title">${escapeHtml(title)}</span>
        ${time ? `<span class="conv-time">${escapeHtml(time)}</span>` : ''}
      </span>`;
    btn.title = title;
    btn.addEventListener('click', () => selectConversation(c));

    const delBtn = document.createElement('button');
    delBtn.className = 'conv-delete';
    delBtn.type = 'button';
    delBtn.title = '删除对话';
    delBtn.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>`;
    delBtn.addEventListener('click', e => deleteConversation(c, e));

    wrap.appendChild(btn);
    wrap.appendChild(delBtn);
    convList.appendChild(wrap);
  });
}

async function deleteConversation(conv, e) {
  e.stopPropagation();
  if (state.sending) return;
  if (!confirm(`确定删除「${getConvDisplayTitle(conv)}」？`)) return;
  try {
    await api('/delete_conversation', {
      AppID: CONFIG.appId,
      UserID: state.userId,
      AppConversationID: conv.AppConversationID,
    });
    removeConvTitle(conv.AppConversationID);
    if (state.appConversationId === conv.AppConversationID) {
      state.appConversationId = null;
      state.conversationId = null;
      localStorage.removeItem(CONV_KEY);
      messagesEl.innerHTML = '';
      setWelcomeVisible(true);
    }
    await loadConversationList();
    showError('对话已删除');
  } catch (err) {
    showError('删除失败：' + err.message);
  }
}

function highlightActiveConv() {
  convList.querySelectorAll('.conv-item-wrap').forEach(el => {
    el.classList.toggle('active', el.dataset.id === state.appConversationId);
  });
}

async function selectConversation(conv) {
  if (state.sending) return;
  state.appConversationId = conv.AppConversationID;
  state.conversationId = conv.ConversationID;
  localStorage.setItem(CONV_KEY, state.appConversationId);
  highlightActiveConv();
  closeSidebar();
  await loadMessages();
}

async function loadMessages() {
  if (!state.appConversationId || state.sending) return;
  closeKbDrawer();
  closeKbDetail();
  try {
    const data = await api('/get_conversation_messages', {
      AppID: CONFIG.appId,
      UserID: state.userId,
      AppConversationID: state.appConversationId,
      ConversationID: state.conversationId || undefined,
      Limit: 50,
    });
    messagesEl.innerHTML = '';
    const msgs = data.Messages || [];
    if (!msgs.length) {
      setWelcomeVisible(true);
      return;
    }
    setWelcomeVisible(false);
    msgs.forEach(m => {
      if (m.Query && m.AnswerInfo?.Answer) {
        appendHistoryTurn(m.Query, m.AnswerInfo.Answer, m.AnswerInfo.MessageID, m.AnswerInfo.TracingJsonStr);
      } else if (m.Query) {
        appendTurn(m.Query);
      }
    });
    const firstQuery = msgs.find(m => m.Query)?.Query;
    if (firstQuery) applyConversationTitle(state.appConversationId, firstQuery);
    scrollToBottom();
  } catch (e) {
    showError('加载对话失败：' + e.message);
  }
}

async function stopActiveChat() {
  if (!activeChat) return;
  const { abortController, messageId } = activeChat;
  abortController.abort();
  if (messageId && state.appConversationId) {
    try {
      await api('/stop_message', {
        AppID: CONFIG.appId,
        UserID: state.userId,
        AppConversationID: state.appConversationId,
        MessageID: messageId,
      });
    } catch {}
  }
}

async function readStreamResponse(res, stream) {
  if (!res.body) throw new Error('浏览器不支持流式读取');
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parsed = parseSSEBuffer(buffer);
    buffer = parsed.rest;
    parsed.events.forEach(obj => stream.handleEvent(obj));
    stream.flush();
  }

  if (buffer.trim()) {
    parseSSEBuffer(buffer + '\n\n').events.forEach(obj => stream.handleEvent(obj));
    stream.flush();
  }
}

async function runStreamRequest(path, body, turn, { resetAnswer = false } = {}) {
  const convId = state.appConversationId;
  if (!convId) throw new Error('会话未就绪，请重试');

  if (resetAnswer) {
    const block = turn.querySelector('.answer-block');
    if (block) block.innerHTML = '';
    clearTurnKbData(turn);
    closeKbDrawer();
  }

  const ctx = appendAnswerBlock(turn);
  ctx.turn = turn;
  const stream = createStreamController(ctx);
  const abortController = new AbortController();
  activeChat = { abortController, messageId: null, stream, ctx, turn };

  let stopped = false;

  try {
    const res = await fetch(`${CONFIG.apiBase}${path}`, {
      method: 'POST',
      signal: abortController.signal,
      headers: {
        'Apikey': CONFIG.apiKey,
        'Content-Type': 'application/json',
        'Accept': 'text/event-stream',
      },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const errText = await res.text();
      let errMsg = errText;
      try { errMsg = JSON.parse(errText).ResponseMetadata?.Error?.Message || errText; } catch {}
      throw new Error(errMsg);
    }

    await readStreamResponse(res, stream);
    stream.finish();
    if (activeChat?.messageId) turn.dataset.messageId = activeChat.messageId;
  } catch (e) {
    if (e.name === 'AbortError') {
      stopped = true;
      if (activeChat?.messageId) turn.dataset.messageId = activeChat.messageId;
      stream.abortStopped();
    } else {
      throw e;
    }
  } finally {
    activeChat = null;
  }

  if (!stopped) {
    await loadConversationList();
    highlightActiveConv();
  }
  return { stopped };
}

async function runInlineChat(query, turn, files, opts = {}) {
  const body = {
    AppID: CONFIG.appId,
    AppConversationID: state.appConversationId,
    Query: buildInlineQuery(query, files),
    UserID: state.userId,
    ResponseMode: 'streaming',
  };
  console.info('[Goalin] inline 附件已并入 Query，字数约', body.Query.length);
  return runStreamRequest('/chat_query_v2', body, turn, opts);
}

async function runNativeChat(query, turn, files, { allowInlineFallback = true } = {}) {
  const normalized = await refreshFileUrls(files);
  if (!normalized.length) {
    throw new Error('附件缺少有效下载地址，请移除后重新上传');
  }
  const body = {
    AppID: CONFIG.appId,
    AppConversationID: state.appConversationId,
    Query: query,
    UserID: state.userId,
    ResponseMode: 'streaming',
    QueryExtends: { Files: normalized },
  };
  console.info('[Goalin] native 附件（QueryExtends.Files，Url 为 HiAgent 公网）:', normalized);
  if (normalized.some(f => f.Url && !isHiAgentServiceUrl(f.Url))) {
    console.warn('[Goalin] 警告：附件 Url 非 HiAgent 公网地址，工作流可能无法读取');
  }
  try {
    const result = await runStreamRequest('/chat_query_v2', body, turn);
    if (allowInlineFallback && CONFIG.nativeInlineFallback && shouldInlineFallbackAfterNative(turn, files)) {
      console.warn('[Goalin] native 读附件失败，改用 inline 重试');
      return runInlineChat(query, turn, files, { resetAnswer: true });
    }
    return result;
  } catch (e) {
    const msg = String(e.message || '');
    if (!/upload file config is not enabled/i.test(msg)) throw e;
    const fallback = { ...body };
    delete fallback.QueryExtends;
    fallback.Files = normalized;
    console.warn('[Goalin] QueryExtends 不可用，改用顶层 Files');
    return runStreamRequest('/chat_query_v2', fallback, turn);
  }
}

async function streamChat(query, turn, files = []) {
  if (!files.length) {
    return runStreamRequest('/chat_query_v2', {
      AppID: CONFIG.appId,
      AppConversationID: state.appConversationId,
      Query: query,
      UserID: state.userId,
      ResponseMode: 'streaming',
    }, turn);
  }

  const mode = pickFileDeliveryMode(files);
  console.info('[Goalin] 附件发送模式:', mode, files.map(f => f.name));

  if (mode === 'inline') {
    return runInlineChat(query, turn, files);
  }

  return runNativeChat(query, turn, files);
}

async function regenerateTurn(turn) {
  if (initPromise) await initPromise;
  if (state.sending || !state.ready) return;
  const messageId = turn?.dataset.messageId;
  if (!messageId || !state.appConversationId) return;

  const qEl = turn.querySelector('.query-text');
  if (qEl) {
    const cleaned = formatQueryForDisplay(qEl.textContent);
    if (cleaned) qEl.textContent = cleaned;
  }

  turn.querySelector('.answer-stopped-note')?.remove();
  setSending(true);

  try {
    await runStreamRequest('/query_again', {
      AppID: CONFIG.appId,
      UserID: state.userId,
      AppConversationID: state.appConversationId,
      MessageID: messageId,
      ResponseMode: 'streaming',
    }, turn, { resetAnswer: true });
  } catch (e) {
    showError('重新生成失败：' + e.message);
  } finally {
    setSending(false);
    userInput.focus();
  }
}

async function sendMessage(text) {
  if (initPromise) await initPromise;
  if (state.sending || !state.ready) return;
  const chatGate = window.GoalinAuth?.checkBeforeChat?.();
  if (chatGate && !chatGate.allowed) {
    showError(chatGate.message);
    if (chatGate.loginUrl) setTimeout(() => { location.href = chatGate.loginUrl; }, 1500);
    return;
  }
  if (state.pendingFiles.some(f => f.uploading)) {
    showError('附件仍在上传中，请稍候');
    return;
  }
  const files = takeReadyPendingFiles();
  const queryText = (text || userInput.value).trim();
  const query = queryText || (files.length ? '请阅读附件并回答我的问题' : '');
  if (!query && !files.length) return;

  setSending(true);
  userInput.value = '';
  autoResizeInput();
  if (window.GoalinAuth) await GoalinAuth.recordChat();

  try {
    await ensureConversation();
    applyConversationTitle(state.appConversationId, query);
    const turn = appendTurn(query, files);
    const result = await streamChat(query, turn, files);
    if (result.stopped) showError('已停止生成');
  } catch (e) {
    showError('发送失败：' + explainHiAgentApiError(e.message));
    const existingTurn = messagesEl.querySelector('.turn:last-child');
    const turn = existingTurn || appendTurn(query, files);
    const block = turn.querySelector('.answer-block');
    let ctx;
    if (block?.querySelector('.stream-main')) {
      ctx = {
        statusEl: block.querySelector('.process-status'),
        mainEl: block.querySelector('.stream-main'),
        mainWrap: block.querySelector('.stream-main-wrap'),
        copyBtn: block.querySelector('.copy-btn'),
      };
    } else {
      ctx = appendAnswerBlock(turn);
    }
    hideProcessStatus(ctx.statusEl);
    const errMsg = explainHiAgentApiError(e.message);
    updateAnswerContent(ctx, `**请求出现问题，请稍后重试。**\n\n> ${errMsg}`, { rawText: errMsg });
  } finally {
    setSending(false);
    userInput.focus();
  }
}

function autoResizeInput() {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
}

function closeSidebar() {
  $('sidebar').classList.remove('open');
  $('sidebarOverlay').classList.remove('open');
}

sendBtn.addEventListener('click', () => {
  if (state.sending) stopActiveChat();
  else sendMessage();
});
attachFileBtn.addEventListener('click', () => {
  if (state.fileUploadEnabled !== true || state.sending) return;
  fileInput.click();
});
fileInput.addEventListener('change', () => {
  if (fileInput.files?.length) handleFileSelection(fileInput.files);
});
userInput.addEventListener('input', () => {
  updateSendButton();
  autoResizeInput();
});
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.querySelectorAll('.suggest-btn').forEach(btn => {
  btn.disabled = true;
  btn.addEventListener('click', () => sendMessage(btn.dataset.q));
});

$('newChatBtn').addEventListener('click', async () => {
  if (state.sending) return;
  try {
    await createConversation();
    userInput.focus();
    closeSidebar();
  } catch (e) {
    showError('创建对话失败：' + e.message);
  }
});

$('menuToggle').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('sidebarOverlay').classList.toggle('open');
});
$('sidebarOverlay').addEventListener('click', closeSidebar);

$('kbDrawerClose').addEventListener('click', closeKbDrawer);
$('kbDetailClose').addEventListener('click', closeKbDetail);
kbDetailOverlay.addEventListener('click', e => {
  if (e.target === kbDetailOverlay) closeKbDetail();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (kbDetailOverlay.classList.contains('open')) closeKbDetail();
  else if (kbDrawerPanel.classList.contains('open')) closeKbDrawer();
});

initPromise = (async function init() {
  try {
    await loadAppUploadConfig();
    await loadConversationList();
    if (state.appConversationId) {
      const found = state.conversations.find(c => c.AppConversationID === state.appConversationId);
      if (found) {
        state.conversationId = found.ConversationID;
        await loadMessages();
      } else {
        localStorage.removeItem(CONV_KEY);
        state.appConversationId = null;
      }
    }
  } finally {
    state.ready = true;
    document.querySelectorAll('.suggest-btn').forEach(b => { b.disabled = false; });
    updateSendButton();
    userInput.focus();
    console.info('[Goalin] 对话 API:', CONFIG.apiBase);
    console.info('[Goalin] 上传接口:', CONFIG.uploadApiBase);
    if (isLocalDemoHost() && !CONFIG.apiBase.startsWith(location.origin)) {
      console.warn('[Goalin] 对话 API 未走本地代理，浏览器可能 CORS 失败。请 npm start 后访问 http://127.0.0.1:8765 并强刷。');
    }
    const uploadHint = assertLocalUploadProxy();
    if (uploadHint) console.warn('[Goalin]', uploadHint);
  }
})();
</script>
